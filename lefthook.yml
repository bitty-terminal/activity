# Git hooks managed by lefthook. Install with `just hooks-install`.
# Tool versions are pinned in package.json and bun.lock; this file only wires
# hooks to the justfile recipes that invoke them.

commit-msg:
  commands:
    commit-check:
      run: just commit-check {1}

pre-commit:
  commands:
    markdownlint-staged:
      glob: "*.md"
      run: just lint-files {staged_files}
    prettier-staged:
      glob: "*.md"
      run: just fmt-check-files {staged_files}
